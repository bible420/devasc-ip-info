# Daily check that the real APIs still respond in the format the app expects.
# The unit tests fake every response, so only this job notices a provider change.
# A failure here shows up in the Actions tab and emails the repository owner.
name: Live API check

on:
  schedule:
    - cron: "0 0 * * *" # every day at 00:00 UTC (8:00 AM in the Philippines)
  workflow_dispatch: # also runs on demand from the Actions tab

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live API tests
        env:
          RUN_LIVE_TESTS: "1"
        run: python -m unittest tests.test_live -v
