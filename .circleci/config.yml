# CircleCI pipeline for Address Bench.
#
# - Every push to any branch, including pull request branches, runs the unit
#   tests on Python 3.10 and 3.12. main is protected on GitHub, so a pull
#   request can only be merged when both test jobs pass.
# - After the tests pass on main, the package job saves the app as a
#   downloadable zip (the delivery step).
version: 2.1

jobs:
  tests:
    parameters:
      python-version:
        type: string
    docker:
      - image: cimg/python:<< parameters.python-version >>
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pip install -r requirements.txt
      - run:
          name: Run unit tests
          command: python -m unittest discover -v

  package:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Build the app as a zip
          command: |
            mkdir -p build
            python -m zipfile -c build/address-bench.zip ipinfo_app requirements.txt README.md
      - store_artifacts:
          path: build
          destination: build

workflows:
  test-and-package:
    jobs:
      - tests:
          name: tests-<< matrix.python-version >>
          matrix:
            parameters:
              # 3.10 is the oldest supported version; 3.12 is the version the team uses.
              python-version: ["3.10", "3.12"]
      - package:
          requires:
            - tests-3.10
            - tests-3.12
          filters:
            branches:
              only: main
